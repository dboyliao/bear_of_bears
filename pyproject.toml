[project]
name = "bear-of-bears"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
  "click>=8.4.2",
  "cryptg>=0.6.0",
  "ortools>=9.15.6755",
  "python-dotenv>=1.2.3",
  "telethon>=1.44.0",
]

[project.scripts]
bear-of-bears = "bear_of_bears.cli:bear_of_bears"

[dependency-groups]
dev = [
  "black>=26.5.1",
  "flake8>=7.3.0",
  "ipykernel>=7.3.0",
  "ipython>=9.16.1",
  "isort>=8.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bear_of_bears"]
